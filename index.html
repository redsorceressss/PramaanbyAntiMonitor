<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pramaan — Financial Document Intelligence</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("pramaan-theme");
        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : systemPrefersDark
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root">
      <!-- Replaced automatically as soon as the React app mounts. If this text stays visible, the app is not being served by a web server. -->
      <div id="boot-fallback" role="status" style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:560px;margin:15vh auto;padding:24px;line-height:1.5;text-align:center">
        <h1 style="font-size:1.25rem;margin:0 0 8px">Pramaan is starting…</h1>
        <p id="boot-fallback-text" style="margin:0;opacity:.75">Loading the application. If this message does not go away, open the browser console (F12) for the error.</p>
        <noscript><p>JavaScript is required to run Pramaan.</p></noscript>
      </div>
    </div>
    <script>
      // Opening index.html by double-clicking (file://) can never work for a Vite/React app: the browser
      // cannot load /src/main.tsx. Say so clearly instead of showing a blank page.
      if (location.protocol === "file:") {
        var t = document.getElementById("boot-fallback-text");
        if (t) t.innerHTML = "This page was opened directly from disk, so the app cannot start.<br>Run <code>npm install</code> then <code>npm run dev</code> (or double-click <code>START-WINDOWS.bat</code>) and open the <b>http://localhost</b> address it prints.";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
